apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  LUPERCAL_OPERATOR_AUTH_MODE: {{ .Values.config.operatorAuthMode | quote }}
  LUPERCAL_OPERATOR_ISSUER: {{ .Values.config.operatorIssuer | quote }}
  LUPERCAL_OPERATOR_AUDIENCE: {{ .Values.config.operatorAudience | quote }}
  LUPERCAL_OPERATOR_JWKS_URL: {{ .Values.config.operatorJwksUrl | quote }}
  LUPERCAL_WORKER_POLL_INTERVAL_MS: {{ .Values.config.workerPollIntervalMs | quote }}
  LUPERCAL_WORKER_MAX_ATTEMPTS: {{ .Values.config.workerMaxAttempts | quote }}
  LUPERCAL_RETENTION_WINDOW_HOURS: {{ .Values.config.retentionWindowHours | quote }}
  LUPERCAL_RETENTION_SWEEP_EVERY_LOOPS: {{ .Values.config.retentionSweepEveryLoops | quote }}
  LUPERCAL_RUN_MIGRATIONS_ON_STARTUP: {{ .Values.config.runMigrationsOnStartup | quote }}
