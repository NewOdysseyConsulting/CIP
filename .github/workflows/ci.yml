name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monorepo dependencies
        run: npm ci

      - name: Install Python package
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e python/packages/cip

      - name: Build packages
        run: npm run build

      - name: Run test suites
        run: npm test

      - name: Package SDK dry run
        run: |
          npm pack --workspace @new-odyssey/cip --dry-run
          npm pack --workspace @new-odyssey/cip-conformance --dry-run
