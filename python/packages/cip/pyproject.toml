[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-odyssey-cip"
version = "0.1.0"
description = "Common Infrastructure Protocol for enterprise AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-agents>=0.12.4,<1",
  "httpx>=0.28,<1",
  "psycopg>=3.2,<4"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
