[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-odyssey-cip"
version = "0.3.0a0"
description = "CIP, the open protocol for governed agent operations: protocol types, clients, and the reference implementation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-agents>=0.12.4,<1",
  "boto3>=1.37,<2",
  "httpx>=0.28,<1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
