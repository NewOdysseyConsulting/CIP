[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-odyssey-lupercal"
version = "0.3.0a0"
description = "Lupercal platform modules: Romulus durable state and Remus policy engine for the CIP protocol."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "new-odyssey-cip>=0.3.0a0",
  "psycopg>=3.2,<4"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
