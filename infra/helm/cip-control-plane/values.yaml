nameOverride: ""
fullnameOverride: ""

images:
  api:
    repository: ghcr.io/new-odyssey/cip-control-plane-api
    tag: "0.2.0-alpha.0"
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/new-odyssey/cip-control-plane-worker
    tag: "0.2.0-alpha.0"
    pullPolicy: IfNotPresent
  migrate:
    repository: ghcr.io/new-odyssey/cip-control-plane-migrate
    tag: "0.2.0-alpha.0"
    pullPolicy: IfNotPresent

replicaCount:
  api: 1
  worker: 1

service:
  type: ClusterIP
  port: 8080

config:
  operatorAuthMode: hs256
  operatorIssuer: cip-control-plane
  operatorAudience: cip-operators
  operatorJwksUrl: ""
  workerPollIntervalMs: "1000"
  workerMaxAttempts: "5"
  retentionWindowHours: "168"
  retentionSweepEveryLoops: "300"
  runMigrationsOnStartup: "false"

existingSecrets:
  postgres: cip-control-plane-postgres
  operator: cip-control-plane-operator

resources:
  api: {}
  worker: {}
  migrate: {}

ingress:
  enabled: false
  className: ""
  hosts: []
